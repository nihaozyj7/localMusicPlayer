<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark-minimal">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob: file:; media-src 'self' blob: file:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws:"
    />
    <title>音乐播放器</title>
    <link rel="stylesheet" href="./styles/index.css" />
    <!--
      运行时样式表（空即可）：
      主题切换、毛玻璃强度、用户自定义主题都通过 CSSOM 往这两个 <style> 里 insertRule。
      预置在 HTML 里而不是用 JS 创建，可以避免被 CSP 判为「动态内联样式」。
    -->
    <style id="runtime-tokens"></style>
    <style id="swatch-styles"></style>
  </head>
  <body>
    <!-- ==================================================================
         图标精灵（全部 stroke 型，颜色继承 currentColor，尺寸由 CSS 控制）
         ================================================================== -->
    <svg class="u-hidden" aria-hidden="true" focusable="false">
      <defs>
        <g id="i-base"></g>

        <symbol id="i-music" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

          <circle cx="6.5" cy="18" r="2.5" />
          <circle cx="17.5" cy="16" r="2.5" />
        </symbol>

        <symbol id="i-playlist" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7h11M4 12h8M4 17h6" />
          <path d="M17 15V7.5l3-.6V13" />
          <circle cx="15.5" cy="15.5" r="1.8" />
          <circle cx="18.5" cy="13" r="1.8" />
        </symbol>

        <symbol id="i-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20s-7.5-4.6-7.5-9.6A4.4 4.4 0 0 1 12 7.3a4.4 4.4 0 0 1 7.5 3.1C19.5 15.4 12 20 12 20Z" />
        </symbol>

        <symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-3-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 2.9 14H2.7a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-3l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 2.9-1.2V2.7a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9h.2a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.6 1.2Z" />
        </symbol>

        <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

        </symbol>

        <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">

          <path d="m20 20-3.6-3.6" />
        </symbol>

        <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 12a8 8 0 1 1-2.6-5.9" />

        <symbol id="i-chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

        <symbol id="i-prev" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">

        <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4" />

    <!-- ==================================================================
         应用骨架（固定：标题栏 / 侧边栏 + 主内容 / 底部播放控件）
         ================================================================== -->
    <div class="app" id="app" data-view="library" data-resolved-theme="dark-minimal">
      <!-- ① 标题栏 -->
      <header class="titlebar" id="titlebar">
        <div class="titlebar__brand">
          <svg class="titlebar__logo"><use href="#i-music" /></svg>
          <span>音乐播放器</span>
        </div>
        <span class="titlebar__sep"></span>
        <span class="titlebar__caption" id="titlebar-caption">所有歌曲</span>
        <div class="titlebar__drag"></div>
        <div class="titlebar__actions">
          <button class="titlebar__btn" id="btn-theme-toggle" type="button" data-tip="切换深浅色" aria-label="切换深浅色">
            <svg><use href="#i-moon" /></svg>
          </button>
          <button class="titlebar__btn" id="btn-win-min" type="button" aria-label="最小化">
            <svg><use href="#i-minimize" /></svg>
          </button>
          <button class="titlebar__btn" id="btn-win-max" type="button" aria-label="最大化">
            <svg><use href="#i-maximize" /></svg>
          </button>
          <button class="titlebar__btn titlebar__btn--close" id="btn-win-close" type="button" aria-label="关闭">
            <svg><use href="#i-close" /></svg>
          </button>
        </div>
      </header>

      <!-- ② 侧边栏 -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar__scroll">
          <nav class="sidebar__group" aria-label="曲库">
            <div class="sidebar__label">曲库</div>
            <button class="navitem" type="button" data-nav="library" aria-selected="true">
              <svg class="navitem__icon"><use href="#i-music" /></svg>
              <span class="navitem__text">所有歌曲</span>
              <span class="navitem__badge" id="badge-library">0</span>
            </button>
            <button class="navitem" type="button" data-nav="queue" aria-selected="false">
              <svg class="navitem__icon"><use href="#i-queue" /></svg>
              <span class="navitem__text">播放列表</span>
              <span class="navitem__badge" id="badge-queue">0</span>
            </button>
          </nav>

          <nav class="sidebar__group" aria-label="歌单">
            <div class="sidebar__label">
              <span>歌单</span>
              <button class="sidebar__label-btn" id="btn-new-playlist-sm" type="button" data-tip="新建歌单" aria-label="新建歌单">
                <svg><use href="#i-plus" /></svg>
              </button>
            </div>
            <div id="playlist-nav"></div>
          </nav>
        </div>

        <div class="sidebar__foot">
          <button class="navitem" id="btn-new-playlist" type="button">
            <svg class="navitem__icon"><use href="#i-plus" /></svg>
            <span class="navitem__text">新建歌单</span>
          </button>
          <button class="navitem" type="button" data-nav="settings" aria-selected="false">
            <svg class="navitem__icon"><use href="#i-settings" /></svg>
            <span class="navitem__text">设置</span>
          </button>
        </div>
      </aside>

      <!-- ③ 主内容区 -->
      <main class="main" id="main">
        <div class="content-header" id="content-header">
          <div class="content-header__titles">
            <h1 class="content-header__title" id="content-title">所有歌曲</h1>
            <p class="content-header__subtitle" id="content-subtitle">0 首 · 0 个文件夹</p>
          </div>
          <div class="content-header__tools" id="content-tools"></div>
        </div>
        <div class="content-body" id="content-body"></div>
      </main>

      <!-- 播放界面（覆盖主内容区，底栏独立常驻） -->
      <section class="playerview" id="playerview" data-mode="classic" hidden aria-label="播放界面">
        <div class="playerview__head">
          <button class="playerview__back" id="btn-player-back" type="button">
            <svg><use href="#i-arrow-left" /></svg>
            <span>返回</span>
          </button>
          <span class="playerview__crumb" id="playerview-crumb">正在播放</span>
          <span class="u-spacer"></span>
          <div class="viewmode" id="playerview-mode" role="group" aria-label="播放界面样式">
            <button class="viewmode__btn" type="button" data-pv-mode="classic" aria-pressed="true" data-tip="经典">
              <svg><use href="#i-disc" /></svg>
            </button>
            <button class="viewmode__btn" type="button" data-pv-mode="immersive" aria-pressed="false" data-tip="沉浸">
              <svg><use href="#i-immersive" /></svg>
            </button>
            <button class="viewmode__btn" type="button" data-pv-mode="minimal" aria-pressed="false" data-tip="简约">
              <svg><use href="#i-minimal" /></svg>
            </button>
          </div>
        </div>
        <div class="playerview__stage" id="playerview-stage"></div>
      </section>

      <!-- ④ 底部常驻播放控件 -->
      <footer class="playerbar" id="playerbar">
        <div class="playerbar__now">
          <button class="playerbar__cover" id="bar-cover" type="button" data-tip="打开播放界面" aria-label="打开播放界面">
            <img id="bar-cover-img" alt="" />
            <svg class="playerbar__cover-icon"><use href="#i-expand" /></svg>
          </button>
          <div class="playerbar__meta" id="bar-meta">
            <span class="playerbar__title" id="bar-title">未在播放</span>
            <span class="playerbar__sub" id="bar-sub">选择一首歌曲开始</span>
          </div>
          <button class="playerbar__heart" id="bar-heart" type="button" aria-pressed="false" data-tip="加入我喜欢" aria-label="加入我喜欢">
            <svg><use href="#i-heart" /></svg>
          </button>
        </div>

        <div class="playerbar__center">
          <div class="transport">
            <button class="transport__btn" id="btn-prev" type="button" data-tip="上一曲" aria-label="上一曲">
              <svg><use href="#i-prev" /></svg>
            </button>
            <button class="transport__btn transport__btn--main" id="btn-play" type="button" data-tip="播放/暂停" aria-label="播放">
              <svg id="icon-play"><use href="#i-play" /></svg>
            </button>
            <button class="transport__btn" id="btn-next" type="button" data-tip="下一曲" aria-label="下一曲">
              <svg><use href="#i-next" /></svg>
            </button>
          </div>
          <div class="progress">
            <span class="progress__time" id="time-current">00:00</span>
            <div class="slider" id="progress" role="slider" tabindex="0" aria-label="播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-disabled="false">
              <div class="slider__rail">
                <div class="slider__buffer" id="progress-buffer"></div>
                <div class="slider__fill" id="progress-fill"></div>
              </div>
              <div class="slider__thumb"></div>
              <div class="slider__bubble" id="progress-bubble">00:00</div>
            </div>
            <span class="progress__time progress__time--total" id="time-total">00:00</span>
          </div>
        </div>

        <div class="playerbar__tools">
          <div class="volume">
            <button class="volume__btn" id="btn-mute" type="button" data-tip="静音" aria-label="静音">
              <svg id="icon-volume"><use href="#i-volume-high" /></svg>
            </button>
            <div class="slider volume__slider" id="volume" role="slider" tabindex="0" aria-label="音量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80">
              <div class="slider__rail">
                <div class="slider__fill" id="volume-fill"></div>
              </div>
              <div class="slider__thumb"></div>
              <div class="slider__bubble" id="volume-bubble">80</div>
            </div>
          </div>
          <button class="mode-btn" id="btn-mode" type="button" data-mode="sequence" data-tip="顺序播放" aria-label="播放模式">
            <svg id="icon-mode"><use href="#i-list-order" /></svg>
            <span class="mode-btn__badge">1</span>
          </button>
          <button class="mode-btn" id="btn-lyrics-toggle" type="button" data-tip="显示歌词" aria-label="显示歌词">
            <svg><use href="#i-lyrics" /></svg>
          </button>
          <button class="mode-btn" id="btn-fullscreen" type="button" data-tip="全屏" aria-label="全屏">
            <svg><use href="#i-expand" /></svg>
          </button>
        </div>
      </footer>
    </div>

    <!-- 浮层容器 -->
    <div class="menu" id="menu" hidden role="menu"></div>
    <div class="modal-backdrop" id="modal-backdrop" hidden></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div class="scanning" id="scanning" hidden>
      <div class="scanning__box">
        <div class="scanning__ring"></div>
        <div class="scanning__text" id="scanning-text">正在扫描音乐文件夹…</div>
      </div>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
