    />
    <!--
      注意：img-src 只有 'self' —— 在线封面**不能**直接写第三方地址，
      必须走后端代理（/online/cover?...，见 services_online.go）。
      代理出来的地址与页面同源，既满足 CSP，也顺手解决了图床校验 Referer 的问题。
    -->
    <title>LMPlayer</title>
    <!--
      首帧主题（同步阻塞脚本，必须放在样式表前面）：
      主题本来是由 JS 在启动时套用的，而在 JS 跑起来之前页面用的是根元素上
      写死的 data-theme="dark-minimal"（近黑）。于是浅色主题会「先黑再白」，
      封面取色主题会「先黑 → 再占位灰 → 再取色重绘」。
      这个脚本由 Go 侧按磁盘上的真实配置即时生成（见 early_theme.go）：
      它把 data-theme / data-mode / --seed / --seed-2 直接写在 <html> 上，
      首帧就是对的颜色。外链而非内联是为了不放开 CSP 的 'unsafe-inline'。
      浏览器预览（没有 Go 后端）下它 404，脚本不会执行，行为与以前完全一致。
    -->
    <script src="/early-theme.js"></script>
    <!--
      运行时样式表（空即可）：
      主题切换、毛玻璃强度、用户自定义主题都通过 CSSOM 往这两个 <style> 里 insertRule。
      预置在 HTML 里而不是用 JS 创建，可以避免被 CSP 判为「动态内联样式」。
    -->
    <style id="runtime-tokens"></style>
    <style id="swatch-styles"></style>
    <!--
      启动过渡画面（#boot-splash）的样式。
      刻意内联在 <head> 里、而不是放进 styles/*.css：
        · 它必须在外链样式表之后「立刻」生效，不能等任何一次额外请求；
        · 这一段只服务首帧，与主题令牌体系无关，放在这里不会污染主题。
      CSP 的 style-src 本来就允许 unsafe-inline（见上面的 meta）。
    -->
    <style id="boot-splash-style">
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        /* 缓存图还没解码出来时先铺主题底色，避免闪一下白 */
        background: var(--bg-window, #0b0c12);
        opacity: 1;
        transition: opacity 0.22s ease;
        /* 过渡画面只负责好看：不吃鼠标事件（拖动 / 点击照常落到窗口上） */
        pointer-events: none;
      }
      #boot-splash[data-hide] {
        opacity: 0;
      }
      /* 缓存图默认**不可见**：它有可能 404（首次启动 / 非 Windows / 浏览器预览），
         而浏览器对加载失败的 <img> 会画一个「碎图标」—— 那正是用户看到的那张破图。
         只有确认真的加载出来了（data-hasframe，见 js/main.js）才显示。
         用 opacity 而不是 display:none，是为了保证图片一定会被请求与解码。 */
      #boot-splash__frame {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        /* 窗口尺寸 / DPI 与上次不同也能铺满：多出来的部分裁掉即可 */
        object-fit: cover;
        object-position: top left;
        opacity: 0;
      }
      #boot-splash[data-hasframe] #boot-splash__frame {
        opacity: 1;
      }
      /* 加载动画：默认形态（还没有缓存图 / 还没确认能显示） */
      #boot-splash__mark {
        position: relative;
        display: flex;
        width: 72px;
        height: 72px;
        align-items: center;
        justify-content: center;
      }
      #boot-splash[data-hasframe] #boot-splash__mark {
        display: none;
      }
      #boot-splash__mark svg {
        width: 27px;
        height: 27px;
        color: var(--text-2, rgba(244, 244, 246, 0.66));
      }
      /* 转圈的那一圈：用 ::after 画，省一个 DOM 节点 */
      #boot-splash__mark::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid var(--accent-weak, rgba(255, 255, 255, 0.14));
        border-top-color: var(--accent, #ffffff);
        animation: boot-splash-spin 0.9s linear infinite;
      }
      @keyframes boot-splash-spin {
        to {
          transform: rotate(1turn);
        }
      }
    </style>

    <!-- ==================================================================
         应用骨架
         ==================================================================
         迁移到 Lit 之后，标题栏 / 侧边栏 / 内容区 / 底栏 / 各种浮层都由
         <mp-app> 及其子组件渲染（见 js/ui/*.js），这里只留一个挂载点。

         为什么不再把它们静态写在 HTML 里：
           · 静态节点必须靠「谁去 $() 拿它、谁去改哪个属性」的隐性分工来同步，
             少写一处就是「点了没反应 / 界面不更新」；
           · Lit 组件用依赖数组声明自己要什么，更新是增量的（part 级 diff），
             也不会再出现「整块 innerHTML 重建 → 丢焦点 / 丢滚动 / 重播动画」。

         图标精灵仍然留在这里：它是纯静态资源（theme / 皮肤 / 自检脚本都按
         #i-xxx 引用），放进模板只会每次渲染都重新解析一遍。

         保留的对外契约：所有 id / class 与迁移前一致，皮肤包
         （packages/player-skins）拼的容器 id、以及 tools/*.mjs 自检脚本
         查询的选择器都没有变化。
    -->
    <mp-app></mp-app>
