<!DOCTYPE html>
<!-- dl-window 是桌面歌词窗口的页面标记：desktoplyrics.css 里对 html/body 的
     「整窗透明」规则必须挂在它下面。构建配置 cssCodeSplit:false 会把这张页面的
     CSS 和主界面的 CSS 合并成一个文件（两个 <link> 指向同一个 style-*.css），
     不限定作用域的话，那条 background:transparent!important 会一起作用到主界面，
     把主窗口的底色打穿（浅色主题下露出窗口的近黑底色 = 一整片黑）。 -->
<html lang="zh-CN" class="dl-window">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws:"
    />
    <title>桌面歌词</title>
    <!--
      独立页面：桌面歌词窗口（见 Go 侧 desktop_lyrics.go）。
      刻意**不引入** styles/index.css —— 那套样式会给 html/body 铺底色，
      而这里整块区域必须是全透明的，只显示文字。
    -->
    <script type="module" crossorigin src="/assets/lyrics-DF1_UOrc.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/bridge-v7_LcqlS.js">
    <link rel="stylesheet" crossorigin href="/assets/style-BJprWNI_.css">
  </head>
  <body>
    <div class="dl" id="dl" data-state="idle" data-style="classic">
      <!-- 悬浮控制栏：鼠标移入窗口时才出现（"常规窗口"形态）。
           里面是「桌面歌词样式」下拉框；不悬浮时整块（含窗口背景）完全透明，
           不会在桌面上留下一条半透明的色块。 -->
      <div class="dl__bar" id="dl-bar">
        <label class="dl__bar-label" for="dl-style">桌面歌词样式</label>
        <div class="dl__select-wrap">
          <select class="dl__select" id="dl-style" aria-label="桌面歌词样式"></select>
        </div>
      </div>
      <p class="dl__line" id="dl-line"></p>
      <p class="dl__tip" id="dl-tip">桌面歌词 · 播放歌曲后逐行显示（鼠标移入可选择样式，拖动可移动）</p>
    </div>
  </body>
</html>
