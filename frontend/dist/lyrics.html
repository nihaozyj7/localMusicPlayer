<!DOCTYPE html>
<!-- dl-window 是桌面歌词窗口的页面标记：desktoplyrics.css 里对 html/body 的
     「整窗透明」规则必须挂在它下面。构建配置 cssCodeSplit:false 会把这张页面的
     CSS 和主界面的 CSS 合并成一个文件（两个 <link> 指向同一个 style-*.css），
     不限定作用域的话，那条 background:transparent!important 会一起作用到主界面，
     把主窗口的底色打穿（浅色主题下露出窗口的近黑底色 = 一整片黑）。 -->
<html lang="zh-CN" class="dl-window">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws:"
    />
    <title>桌面歌词</title>
    <!--
      独立页面：桌面歌词窗口（见 Go 侧 desktop_lyrics.go）。
      刻意**不引入** styles/index.css —— 那套样式会给 html/body 铺底色，
      而这里整块区域必须是全透明的，只显示文字。
    -->
    <script type="module" crossorigin src="/assets/lyrics-CmWXmgSJ.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/bridge-BT7w5HFT.js">
    <link rel="modulepreload" crossorigin href="/assets/base-CKcVTdc-.js">
    <link rel="stylesheet" crossorigin href="/assets/style-BN4klFCG.css">
  </head>
  <body>
    <!-- 桌面歌词的 DOM 由 <mp-desktop-lyrics> 渲染（见 js/ui/desktop-lyrics.js）。
         id / class 与迁移前一致，desktoplyrics.css 原样命中。 -->
    <mp-desktop-lyrics></mp-desktop-lyrics>

  </body>
</html>
