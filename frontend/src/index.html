<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark-minimal">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob: file:; media-src 'self' blob: file:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws:"
    />
    <!--
      注意：img-src 只有 'self' —— 在线封面**不能**直接写第三方地址，
      必须走后端代理（/online/cover?...，见 services_online.go）。
      代理出来的地址与页面同源，既满足 CSP，也顺手解决了图床校验 Referer 的问题。
    -->
    <title>音乐播放器</title>
    <!--
      首帧主题（同步阻塞脚本，必须放在样式表前面）：
      主题本来是由 JS 在启动时套用的，而在 JS 跑起来之前页面用的是根元素上
      写死的 data-theme="dark-minimal"（近黑）。于是浅色主题会「先黑再白」，
      封面取色主题会「先黑 → 再占位灰 → 再取色重绘」。
      这个脚本由 Go 侧按磁盘上的真实配置即时生成（见 early_theme.go）：
      它把 data-theme / data-mode / --seed / --seed-2 直接写在 <html> 上，
      首帧就是对的颜色。外链而非内联是为了不放开 CSP 的 'unsafe-inline'。
      浏览器预览（没有 Go 后端）下它 404，脚本不会执行，行为与以前完全一致。
    -->
    <script src="/early-theme.js"></script>
    <link rel="stylesheet" href="./styles/index.css" />
    <!--
      运行时样式表（空即可）：
      主题切换、毛玻璃强度、用户自定义主题都通过 CSSOM 往这两个 <style> 里 insertRule。
      预置在 HTML 里而不是用 JS 创建，可以避免被 CSP 判为「动态内联样式」。
    -->
    <style id="runtime-tokens"></style>
    <style id="swatch-styles"></style>
  </head>

        <symbol id="i-image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="16" rx="2.5" />
          <circle cx="8.5" cy="9.5" r="1.6" />
          <path d="M4 17.5 9 12l3.5 3.5L15 13l5 4.5" />
        </symbol>

        <!-- 轮播：叠起来的两张图 + 循环箭头，表示「多张封面轮换显示」 -->
        <symbol id="i-slideshow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="7" y="3.5" width="14" height="11" rx="2.2" />
          <path d="M4 7.5v9A2.5 2.5 0 0 0 6.5 19H16" />
          <path d="M12.5 12.5 15 10l2.5 2.5M17.5 7.5 15 10l-2.5-2.5" />
        </symbol>

        <!-- 密度：列表行高 -->
        <symbol id="i-density" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6h16M4 10h16M4 14h16M4 18h16" />
        </symbol>

        <!-- 嵌入元数据：写进文件 -->
        <symbol id="i-tag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11.5 3H20v8.5L11 20.5a2 2 0 0 1-2.8 0l-5.7-5.7a2 2 0 0 1 0-2.8Z" />
          <circle cx="16" cy="7.5" r="1.5" />
        </symbol>

        <!-- 下载任务：箭头落进托盘 -->
        <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3.5v11" />
          <path d="m7.5 10.5 4.5 4.5 4.5-4.5" />
          <path d="M4.5 19.5h15" />
        </symbol>
      </defs>
    </svg>

    <!-- ==================================================================
         应用骨架（固定：标题栏 / 侧边栏 + 主内容 / 底部播放控件）
         ================================================================== -->
    <div class="app" id="app" data-view="library" data-mode="classic" data-resolved-theme="dark-minimal">
      <!-- 播放详情页的整窗背景层容器。
           渲染（图片/遮罩/颗粒）由皮肤包负责（见 packages/player-skins/src/background-layer.js），
           宿主只决定它放在哪：必须在 .playerview 之外，因为后者有 transform 动效，
           会让内部 fixed 元素的包含块变成它自己，从而被裁在详情页范围内铺不满。
           .skin-bg 这个类写在这里（而不是由皮肤加）：它决定容器在窗口里的位置与层级，
           皮肤切换时容器必须一直在。 -->
      <div class="skin-bg" id="skin-background" hidden aria-hidden="true"></div>

      <!-- ① 标题栏
           需求：移除「所有歌曲」这类当前页面标题文字。
           当前页面已经由侧边栏选中态 + 内容区大标题表达，标题栏再重复一遍
           只会占地方，而且长歌单名会把窗口按钮挤歪。 -->
      <header class="titlebar" id="titlebar">
        <div class="titlebar__brand">
          <svg class="titlebar__logo"><use href="#i-music" /></svg>
          <span>音乐播放器</span>
        </div>
        <span class="titlebar__sep"></span>
        <div class="titlebar__drag"></div>
        <div class="titlebar__actions">
          <!-- 下载任务入口：**有下载任务时才出现**（初始 hidden，由 downloads.js 控制）。
               按钮静态写在 HTML 里而不是运行时 inject —— 见 README「界面上的按钮写在
               index.html 里」那条设计约束：inject 的按钮一旦模块没被 import 就会静默消失。 -->
          <button class="titlebar__btn titlebar__btn--download" id="btn-downloads" type="button"
            data-tip="下载任务" aria-label="下载任务" aria-pressed="false" hidden>
            <svg><use href="#i-download" /></svg>
            <span class="titlebar__badge" id="download-badge" hidden></span>
          </button>
          <button class="titlebar__btn" id="btn-theme-toggle" type="button" data-tip="切换深浅色" aria-label="切换深浅色">
            <svg><use href="#i-moon" /></svg>
          </button>
          <button class="titlebar__btn" id="btn-settings" type="button" data-tip="设置" aria-label="设置">
            <svg><use href="#i-settings" /></svg>
          </button>
          <button class="titlebar__btn" id="btn-win-min" type="button" aria-label="最小化">
            <svg><use href="#i-minimize" /></svg>
          </button>
          <button class="titlebar__btn" id="btn-win-max" type="button" aria-label="最大化">
            <svg><use href="#i-maximize" /></svg>
          </button>
          <button class="titlebar__btn titlebar__btn--close" id="btn-win-close" type="button" aria-label="关闭">
            <svg><use href="#i-close" /></svg>
          </button>
        </div>
      </header>

      <!-- ② 侧边栏 -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar__scroll">
          <nav class="sidebar__group" aria-label="曲库">
            <div class="sidebar__label">曲库</div>
            <button class="navitem" type="button" data-nav="library" aria-selected="true">
              <svg class="navitem__icon"><use href="#i-music" /></svg>
              <span class="navitem__text">本地歌曲</span>
              <span class="navitem__tail"><span class="navitem__badge" id="badge-library">0</span></span>
            </button>
            <button class="navitem" type="button" data-nav="queue" aria-selected="false">
              <svg class="navitem__icon"><use href="#i-queue" /></svg>
              <span class="navitem__text">播放列表</span>
              <span class="navitem__tail"><span class="navitem__badge" id="badge-queue">0</span></span>
            </button>
          </nav>

          <nav class="sidebar__group" aria-label="歌单">
            <div class="sidebar__label">
              <span>歌单</span>
              <button class="sidebar__label-btn" id="btn-new-playlist-sm" type="button" data-tip="新建歌单" aria-label="新建歌单">
                <svg><use href="#i-plus" /></svg>
              </button>
            </div>
            <div id="playlist-nav"></div>
          </nav>
        </div>
      </aside>

      <!-- ③ 主内容区 -->
      <main class="main" id="main">
        <div class="content-header" id="content-header">
          <div class="content-header__titles">
            <h1 class="content-header__title" id="content-title">所有歌曲</h1>
            <p class="content-header__subtitle" id="content-subtitle">0 首 · 0 个文件夹</p>
          </div>
          <div class="content-header__actions">
            <!-- 本地歌曲的搜索筛选框（需求：挪到「重新扫描」左边并缩小尺寸）。
                 它仍然是 #content-body 之外的静态节点：输入时只重绘列表，
                 不会重建输入框，因此焦点与输入法状态不会被打断。 -->
            <div class="content-filter" id="content-filter" hidden>
              <div class="content-filter__field">
                <svg class="content-filter__icon" aria-hidden="true"><use href="#i-search" /></svg>
                <input class="content-filter__input" id="content-filter-input" type="text"
                  placeholder="筛选本地歌曲" autocomplete="off" spellcheck="false"
                  aria-label="筛选本地歌曲" />
                <button class="content-filter__clear" id="content-filter-clear" type="button" hidden
                  aria-label="清空筛选"><svg><use href="#i-close" /></svg></button>
              </div>
              <span class="content-filter__count" id="content-filter-count"></span>
            </div>
            <div class="content-header__tools" id="content-tools"></div>
          </div>
        </div>
        <div class="content-body" id="content-body"></div>
      </main>

      <!-- 播放界面（覆盖主内容区，底栏独立常驻） -->
      <section class="playerview" id="playerview" data-skin="classic" hidden aria-label="播放界面">
        <div class="playerview__head">
          <button class="playerview__back" id="btn-player-back" type="button">
            <svg><use href="#i-arrow-left" /></svg>
            <span>返回</span>
          </button>
          <span class="u-spacer"></span>
          <!-- 「封面」按钮 + 轮播开关 = 一个按钮组（样式与右边的播放界面样式组一致）。
               两者都只对本地歌曲有意义：在线试听没有本地文件，按钮会置灰。 -->
          <div class="viewmode" id="playerview-cover-group" role="group" aria-label="封面">
            <button class="viewmode__btn" id="btn-player-cover" type="button" data-tip="更换封面" aria-label="更换封面">
              <svg><use href="#i-image" /></svg>
            </button>
            <button class="viewmode__btn" id="btn-cover-carousel" type="button" aria-pressed="false"
              data-tip="封面轮播" aria-label="封面轮播">
              <svg><use href="#i-slideshow" /></svg>
            </button>
          </div>
          <!-- 播放界面样式组：按钮由前端按「皮肤注册表」动态渲染
               （内置三种在 @musicplayer/player-skins 里，用户还能往数据目录丢第三方样式） -->
          <div class="viewmode" id="playerview-mode" role="group" aria-label="播放界面样式"></div>
        </div>
        <div class="playerview__stage" id="playerview-stage"></div>
      </section>

      <!-- ④ 底部常驻播放控件
           结构：上面一整行进度条，下面一行「封面 / 曲目信息 / 收藏·歌单 / 传输 / 音量 / 模式·歌词·列表」 -->
      <footer class="playerbar" id="playerbar">
        <div class="playerbar__progress">
          <span class="progress__time" id="time-current">00:00</span>
          <div class="slider" id="progress" role="slider" tabindex="0" aria-label="播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-disabled="false">
            <div class="slider__rail">
              <div class="slider__buffer" id="progress-buffer"></div>
              <div class="slider__fill" id="progress-fill"></div>
            </div>
            <div class="slider__thumb"></div>
            <div class="slider__bubble" id="progress-bubble">00:00</div>
          </div>
          <span class="progress__time progress__time--total" id="time-total">00:00</span>
        </div>

        <div class="playerbar__row">
          <div class="playerbar__now">
            <button class="playerbar__cover" id="bar-cover" type="button" data-tip="播放详情页" aria-label="播放详情页">
              <img id="bar-cover-img" alt="" />
              <svg class="playerbar__cover-icon"><use href="#i-expand" /></svg>
            </button>
            <div class="playerbar__meta" id="bar-meta" data-tip="播放详情页">
              <span class="playerbar__title" id="bar-title">未在播放</span>
              <span class="playerbar__sub" id="bar-sub">选择一首歌曲开始</span>
            </div>
            <button class="playerbar__heart" id="bar-heart" type="button" aria-pressed="false" data-tip="加入我喜欢" aria-label="加入我喜欢">
              <svg><use href="#i-heart" /></svg>
            </button>
            <button class="playerbar__heart playerbar__add" id="bar-add" type="button" data-tip="添加到歌单" aria-label="添加到歌单">
              <svg><use href="#i-playlist-plus" /></svg>
            </button>
          </div>

          <div class="playerbar__center">
            <div class="transport">
              <button class="transport__btn" id="btn-prev" type="button" data-tip="上一曲" aria-label="上一曲">
                <svg><use href="#i-prev" /></svg>
              </button>
              <button class="transport__btn transport__btn--main" id="btn-play" type="button" data-tip="播放/暂停" aria-label="播放">
                <svg id="icon-play"><use href="#i-play" /></svg>
              </button>
              <button class="transport__btn" id="btn-next" type="button" data-tip="下一曲" aria-label="下一曲">
                <svg><use href="#i-next" /></svg>
              </button>
            </div>
          </div>

          <div class="playerbar__tools">
            <div class="volume">
              <button class="volume__btn" id="btn-mute" type="button" data-tip="静音" aria-label="静音">
                <svg id="icon-volume"><use href="#i-volume-high" /></svg>
              </button>
              <div class="slider volume__slider" id="volume" role="slider" tabindex="0" aria-label="音量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80">
                <div class="slider__rail">
                  <div class="slider__fill" id="volume-fill"></div>
                </div>
                <div class="slider__thumb"></div>
                <div class="slider__bubble" id="volume-bubble">80</div>
              </div>
            </div>
            <button class="mode-btn" id="btn-mode" type="button" data-mode="sequence" data-tip="列表循环" aria-label="播放模式">
              <svg id="icon-mode"><use href="#i-repeat" /></svg>
              <span class="mode-btn__badge">1</span>
            </button>
            <!-- 手动匹配歌词（在线搜索候选 → 应用到当前歌曲，见 online.js）。
                 图标用「词」这个字本身：放大镜/歌词线条都表达不出「匹配歌词」，
                 字标最直白。需求：歌词不提供「隐藏」入口，所以这里没有歌词显隐按钮 ——
                 详情页那块歌词区由设置 → 歌词 控制。 -->
            <button class="mode-btn" id="btn-lyrics-match" type="button" data-tip="手动匹配歌词" aria-label="手动匹配歌词">
              <svg><use href="#i-lyric-match" /></svg>
            </button>
            <!-- 桌面歌词 / 桌面背景歌词：这两个是**一组单选按钮**（选了一个就不能
                 选另一个，切换逻辑见 desktop-mode.js）。
                 包成一组不只是为了好看：role="radiogroup" + 每个按钮 role="radio"，
                 读屏软件才会把「两者只能选一个」这件事念出来，
                 而两个各自独立的开关按钮是表达不出这层关系的。
                 注意高亮用的是 aria-checked（radio 的语义），不是 aria-pressed。 -->
            <div class="mode-group" role="radiogroup" aria-label="桌面歌词方式">
              <button class="mode-btn" id="btn-desktop-lyrics" type="button" role="radio" aria-checked="false" data-tip="桌面歌词" aria-label="桌面歌词">
                <svg><use href="#i-desktop-lyrics" /></svg>
              </button>
              <button class="mode-btn" id="btn-desktop-wallpaper" type="button" role="radio" aria-checked="false" data-tip="桌面背景歌词" aria-label="桌面背景歌词">
                <svg><use href="#i-desktop-wallpaper" /></svg>
              </button>
            </div>
            <button class="mode-btn" id="btn-sleep" type="button" aria-pressed="false" data-tip="定时停止" aria-label="定时停止">
              <svg><use href="#i-clock" /></svg>
              <span class="mode-btn__badge" id="sleep-count" hidden></span>
            </button>
            <button class="mode-btn" id="btn-options" type="button" aria-pressed="false" data-tip="选项" aria-label="选项">
              <svg><use href="#i-options" /></svg>
            </button>
            <button class="mode-btn" id="btn-playlist" type="button" aria-pressed="false" data-tip="播放列表" aria-label="播放列表">
              <svg><use href="#i-playlist" /></svg>
              <span class="mode-btn__badge" id="queue-count">0</span>
            </button>
          </div>
        </div>
      </footer>
    </div>

    <!-- 浮层容器 -->
    <div class="menu" id="menu" hidden role="menu"></div>
    <section class="queue-panel" id="queue-panel" hidden data-state="closed" aria-label="播放列表">
      <div class="queue-panel__head">
        <span class="queue-panel__title">播放列表</span>
        <span class="u-spacer"></span>
        <span class="queue-panel__count" id="queue-panel-count">0 首</span>
        <button class="queue-panel__btn" id="queue-locate" type="button" data-tip="定位到当前播放" aria-label="定位到当前播放">
          <svg><use href="#i-disc" /></svg>
        </button>
        <button class="queue-panel__btn" id="queue-clear" type="button" data-tip="清空列表" aria-label="清空列表">
          <svg><use href="#i-trash" /></svg>
        </button>
        <button class="queue-panel__btn" id="queue-close" type="button" data-tip="关闭" aria-label="关闭播放列表">
          <svg><use href="#i-close" /></svg>
        </button>
      </div>
      <div class="queue-panel__body" id="queue-panel-body"></div>
    </section>
    <!-- 下载任务面板：标题栏「下载任务」按钮打开。
         显示当前与最近的下载任务（进度 / 已完成 / 失败原因），
         入口按钮只在存在任务时出现（见 downloads.js）。 -->
    <section class="download-panel" id="download-panel" hidden data-state="closed" aria-label="下载任务">
      <div class="download-panel__head">
        <svg class="download-panel__icon" aria-hidden="true"><use href="#i-download" /></svg>
        <span class="download-panel__title">下载任务</span>
        <span class="download-panel__count" id="download-panel-count">0 个</span>
        <button class="download-panel__btn" id="download-open-dir" type="button" data-tip="打开下载目录" aria-label="打开下载目录">
          <svg><use href="#i-folder" /></svg>
        </button>
        <button class="download-panel__btn" id="download-clear" type="button" data-tip="清除已完成" aria-label="清除已完成">
          <svg><use href="#i-trash" /></svg>
        </button>
        <button class="download-panel__btn" id="download-close" type="button" data-tip="关闭" aria-label="关闭下载任务面板">
          <svg><use href="#i-close" /></svg>
        </button>
      </div>
      <div class="download-panel__body" id="download-panel-body"></div>
    </section>

    <section class="options-panel" id="options-panel" hidden data-state="closed" aria-label="播放选项">
      <div class="options-panel__head">
        <span class="options-panel__title">播放选项</span>
        <span class="u-spacer"></span>
        <button class="options-panel__btn" id="options-close" type="button" data-tip="关闭" aria-label="关闭选项">
          <svg><use href="#i-close" /></svg>
        </button>
      </div>
      <div class="options-panel__body" id="options-panel-body"></div>
    </section>

    <!-- 定时停止面板：上方是一条可拖拽的 0~300 分钟滑条（需求），
         下面保留「播完当前歌曲」与「取消」两个常用动作。 -->
    <section class="sleep-panel" id="sleep-panel" hidden data-state="closed" aria-label="定时停止">
      <div class="sleep-panel__head">
        <svg class="sleep-panel__icon" aria-hidden="true"><use href="#i-clock" /></svg>
        <span class="sleep-panel__title">定时停止</span>
        <span class="u-spacer"></span>
        <button class="options-panel__btn" id="sleep-close" type="button" data-tip="关闭" aria-label="关闭定时停止">
          <svg><use href="#i-close" /></svg>
        </button>
      </div>
      <div class="sleep-panel__body" id="sleep-panel-body"></div>
    </section>
    <div class="desktop-lyrics" id="desktop-lyrics" hidden aria-hidden="true">
      <div class="desktop-lyrics__line" id="desktop-lyrics-line"></div>
    </div>
    <div class="modal-backdrop" id="modal-backdrop" hidden></div>

    <!-- 设置层：铺满「标题栏之下」的整个窗口（需求：全屏遮罩，仅避开标题栏）。
         标题栏（窗口按钮 / 拖动区）始终保持可用；底栏播放控件被遮罩盖住即可，
         不再在设置层里放一套重复的播放控件。 -->
    <section class="settings-layer" id="settings-layer" data-state="closed" hidden aria-label="设置">
      <div class="settings-layer__panel" role="dialog" aria-modal="true" aria-label="设置">
        <div class="settings-layer__head">
          <svg class="settings-layer__icon" aria-hidden="true"><use href="#i-settings" /></svg>
          <span class="settings-layer__title">设置</span>
          <span class="u-spacer"></span>
          <button class="settings-layer__close" type="button" data-settings-close aria-label="关闭设置">
            <svg><use href="#i-close" /></svg>
          </button>
        </div>
        <div class="settings-layer__body"></div>
      </div>
    </section>

    <div class="cover-layer" id="cover-layer" data-state="closed" hidden aria-label="封面管理">
      <div class="cover-layer__panel" role="dialog" aria-modal="true" aria-label="封面管理">
        <div class="cover-layer__head">
          <svg class="cover-layer__icon" aria-hidden="true"><use href="#i-image" /></svg>
          <span class="cover-layer__title">封面管理</span>
          <span class="u-spacer"></span>
          <button class="cover-layer__close" type="button" data-cover-close aria-label="关闭封面管理">
            <svg><use href="#i-close" /></svg>
          </button>
        </div>
        <div class="cover-layer__body" id="cover-layer-body"></div>
      </div>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div class="scanning" id="scanning" hidden>
      <div class="scanning__box">
        <div class="scanning__ring"></div>
        <div class="scanning__text" id="scanning-text">正在扫描音乐文件夹…</div>
      </div>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
