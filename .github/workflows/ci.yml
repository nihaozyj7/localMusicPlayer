# ============================================================================
#  CI — 代码质量门禁
# ----------------------------------------------------------------------------
#  为什么必须有这个文件：在本仓库里，所有「检查」在此之前都只是**口头约定**。
#  于是发生过这些事：
#    · gofmt 门禁（tools/check-gofmt.mjs）在 Windows 上对所有人恒红
#      —— 因为 .gitattributes 没给 *.go 指定 eol=lf，工作区是 CRLF 而 gofmt 要 LF；
#    · npm run check（lint + tsc + test）悄悄变成退出码 2，而文档里仍记着「通过」；
#    · mock 假数据被打进生产包，长期没人发现。
#  这三件都不是「有人写错了代码」，而是「没有东西在跑检查」。
#
#  门禁内容与本地开发者跑的命令**完全一致**，避免出现「CI 绿、本地红」的分裂：
#    npm run check        → prettier --check + eslint + tsc + node:test（内含「跳过用例必须写明原因」）
#    npm run check:plugins → plugins/*/index.json 与磁盘一致
#    node tools/check-gofmt.mjs
#    go vet / go test -race
#    node tools/check-skipped-tests.mjs → 「没跑的用例有账」
# ============================================================================

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# 同一分支的新推送取消上一轮未完成的运行，省额度也更快拿到结果
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端（lint / 类型 / 单测）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm

      # 用 npm ci 而不是 install：锁文件是唯一真相，避免 CI 上偷偷升级依赖
      - run: npm ci

      # lint && typecheck && test —— 与 package.json 的 check 脚本同一套
      # （check 里还包含 format:check：Prettier 曾经是「名存实亡」的门禁，
      #   104 个文件长期不合规却没人发现，见第六轮审查 建议 13）
      - name: 工程化检查
        run: npm run check

      # ★ 插件清单门禁：plugins/{theme,style}/index.json 是**客户端**读的清单，
      #   改了插件却忘了 `node plugins/build-index.mjs` 重新生成，表现是
      #   「客户端里那个插件看不到 / 装不动」—— 而这一步此前从来不在 CI 里跑，
      #   于是只能靠人记得（第六轮审查 建议 13 的第二半）。
      - name: 插件清单校验
        run: npm run check:plugins

      # 构建前端产物：这一步能抓到「只在构建期暴露」的问题
      # （例如 mock 被 statically import 进产物、入口文件缺失）
      - name: 构建前端
        run: npm run build

  go:
    name: 后端（gofmt / vet / race 测试）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # ★ 必须装这些系统库，否则后端根本编译不过（CGO 依赖它们的头文件）。
      #
      # 包名是从依赖源码里的 pkg-config 指令逐项核对出来的，不是猜的：
      #   wails v3 internal/assetserver/webview/webkit_linux.go
      #     #cgo linux pkg-config: gtk4 webkitgtk-6.0 libsoup-3.0 gio-unix-2.0
      #   golang.design/x/hotkey/hotkey_x11.go   → #include <X11/Xlib.h>
      #   gen2brain/malgo（内含 miniaudio）        → ALSA
      #
      # ★ wails v3 默认走 **GTK4**（webkitgtk-6.0）；GTK3 那条要在构建设置
      #   `gtk3` 标签时才会启用。所以这里装的是 libgtk-4-dev，
      #   装成 libgtk-3-dev 是没用的（pkg-config 找不到 gtk4）。
      #
      # 这个项目只在 Windows 上验证与发布（见 README「系统要求」），
      # 但 CI 跑在 ubuntu-latest 上。此前 gofmt 一直红灯，**后面的步骤从没
      # 真正执行过**，于是这个问题被掩盖了很久 —— 修好 gofmt 之后
      # go vet 立刻以 "X11/Xlib.h: No such file or directory" 失败。
      #
      # 选择「装依赖让后端真正编译」而不是「把后端 CI 改成只跑 GOOS=windows」：
      # 后者等于把 vet / race 测试整个跳过，而这恰恰是 CI 里最有价值的两项
      # （库里有并发扫描与缓存落盘路径，历史上有过真实竞态）。
      - name: 安装后端系统依赖（GTK4/WebKitGTK/X11/ALSA）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libx11-dev \
            libxkbcommon-dev \
            libasound2-dev \
            xvfb \
            pkg-config

      # ★ 还要一个虚拟显示：某个依赖的剪贴板包在初始化时要求能连上 X11，
      #   否则直接 panic（"Failed to initialize the X11 display"）——
      #   那不是在某个测试里失败，而是把整个测试二进制打挂。
      #   装 libx11-dev 只给了编译期头文件，运行期还需要一个真的 display。
      #   xvfb 就是官方提示的做法（见那句 panic 信息里的建议）。
      - name: 启动 Xvfb 虚拟显示
        run: |
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      # gofmt 门禁。注意：仓库里 *.go 已显式 eol=lf，因此 Linux 上不存在
      # 行尾符造成的假红灯（这才是这个检查能长期有效的前提）。
      - name: gofmt
        run: node tools/check-gofmt.mjs

      - name: go vet
        run: go vet . ./internal/... ./tools/...

      # -race 是这个项目最重要的后端质量门禁之一：
      # 库里有多处并发扫描 / 缓存落盘路径，历史上有过真实竞态。
      - name: go test -race
        run: go test -race . ./internal/... ./tools/...

      # ★ 「跳过数 > 0 即失败」门禁（审查报告第六轮 建议 12 / 第 16 条）。
      #
      # 为什么需要它：go test -race 只保证「跑了的都过」，而这个项目里有一批
      # 用例是靠 t.Skip 退出的 —— PlayerService 的 38 个编排用例依赖声卡，
      # 容器里没有声卡时它们会被整批静默跳过，于是 CI 全绿、那批用例其实
      # 一次都没跑（正是那种「没人会注意到」的回归）。
      #
      # 跳过本身允许（真需要设备/外网/平台权限的用例在别的环境里必须能跳），
      # 但必须在 tools/skipped-tests-allowlist.json 里登记原因；任何没登记的
      # 跳过、或某一类跳过数超过登记上限，都会让这一步失败。
      - name: 跳过用例门禁
        run: node tools/check-skipped-tests.mjs

      # ★ 工具链 / 依赖漏洞门禁。
      #
      # 为什么必须有：标准库漏洞只随**实际构建用的** Go 补丁版本修复，而
      # go.mod 的 `go` 指令是「最低版本」语义 —— 它既不保证补丁版本，也不会
      # 触发升级。实测 go1.27.0 下有 10 项标准库漏洞命中真实调用路径
      # （net/http 的 http2、crypto/tls、net/textproto，见 GO-2026-6603/6605/
      # 6607/6608/6609/6610/6611/6612/6613/6617），全部在 go1.27.2 修复。
      # 只靠「记得升级 Go」是不够的：这正是那种**没人会注意到**的回归。
      #
      # 退出码非 0 即失败（有漏洞时 govulncheck 返回 3），不写 `|| true`。
      #
      # 包列表显式写出而不是 `./...`：与上面的 vet / test 保持同一份清单。
      # `./...` 会顺着 node_modules 里的第三方 Go 源码（flatted）跑进去，
      # 那不是本模块的包（见 AGENTS.md「不要用 go test ./...」）。
      - name: govulncheck（标准库与依赖漏洞）
        run: go run golang.org/x/vuln/cmd/govulncheck@latest . ./internal/... ./tools/...
