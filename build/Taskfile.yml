version: "3"

# ============================================================================
#  公共构建任务
#  · 前端走 Vite + npm workspaces：tools/build-frontend.mjs 构建 frontend/dist
#    （Vite 打包 → 拷 frontend/bindings → 同步内置主题），需要 node_modules，
#    缺失时由 frontend:deps → npm install 补上
#  · 绑定由 wails3 generate bindings -b -i 生成（bundled runtime，无需 npm 包）
# ============================================================================

tasks:
  go:mod:tidy:
    summary: Runs `go mod tidy`
    internal: true
    run: once
    cmds:
      - go mod tidy

  generate:bindings:
    summary: 生成前端可用的 Go 绑定（frontend/bindings）
    run: once
    deps:
      - task: go:mod:tidy
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - frontend/bindings/**/*
    cmds:
      - wails3 generate bindings -b -i -clean=true

  ffmpeg:build:
    summary: 从源码编译精简 ffmpeg（5.6MB / LGPL，只在首次构建时需要）
    status:
      - test -f internal/ffmpeg/bin/ffmpeg.exe
    cmds:
      - node tools/build-ffmpeg.mjs
    preconditions:
      - sh: node --version
        msg: "需要 Node.js 才能编译内置 ffmpeg（或手动把 ffmpeg.exe 放到 internal/ffmpeg/bin/）"

  ffmpeg:info:
    summary: 查看内置 ffmpeg 状态（体积、许可证、编译进去的能力清单）
    cmds:
      - node tools/build-ffmpeg.mjs --info

  frontend:deps:
    summary: 安装前端依赖（npm workspaces，仅 node_modules 缺失时执行）
    run: once
    status:
      - test -d node_modules
    sources:
      - package.json
      - frontend/package.json
      - frontend/packages/player-skins/package.json
    cmds:
      - npm install

  build:frontend:
    summary: 构建前端到 frontend/dist（Vite 打包 + Wails 绑定 + 内置主题）
    run: once
    sources:
      - frontend/src/**/*
      - frontend/packages/**/*
      - frontend/vite.config.js
      - package.json
      - tools/build-frontend.mjs
    generates:
      - frontend/dist/**/*
    deps:
      - task: frontend:deps
      - task: generate:bindings
      - task: ffmpeg:build
    cmds:
      - node tools/build-frontend.mjs

  check:frontend:
    summary: 前端工程化检查（lint + 类型检查 + 单测）
    cmds:
      - npm run check

  dev:frontend:
    summary: 启动界面预览服务器（Vite，带 HMR；需先 npm install）
    deps:
      - task: frontend:deps
    cmds:
      - npm run dev

  dev:frontend:static:
    summary: 零依赖静态预览（不需要 node_modules，但没有 HMR / 依赖解析能力有限）
    cmds:
      - node tools/dev-server.js {{.VITE_PORT}}

  generate:icons:
    summary: 由 build/appicon.png 生成 Windows .ico 与 macOS .icns
    run: once
    dir: build
    sources:
      - appicon.png
    generates:
      - windows/icon.ico
    cmds:
      # 注意：任务在 build/ 目录下执行，因此 macfilename 必须显式指定相对路径，
      # 否则 wails3 会去 build/build/darwin/icon.icns 找文件而报错。
      - wails3 generate icons -input appicon.png -windowsfilename windows/icon.ico -macfilename darwin/icon.icns

  update:build-assets:
    summary: 依据 build/config.yml 重新生成打包资源
    dir: build
    cmds:
      - wails3 update build-assets -name "{{.APP_NAME}}" -binaryname "{{.APP_NAME}}" -config config.yml -dir .

  # 预留：把前端与后端一起跑起来的「真·开发模式」（需先构建一次 dist）
  dev:app:
    summary: 构建前端并直接运行应用（改 Go 代码后重跑本任务）
    cmds:
      - task: build:frontend
      - task: run
