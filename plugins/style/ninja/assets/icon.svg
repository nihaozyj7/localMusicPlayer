<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="水果忍者">
  <!-- 一枚被一刀劈开的水果：两半（实心形状，当遮罩用时读起来是"切开的水果"而不是禁行标志） -->
  <g fill="currentColor">
    <path d="M7 33.6h50c0 12.1-9.3 21.9-20.8 21.9h-8.4C16.3 55.5 7 45.7 7 33.6Z" />
    <path d="M12.5 25.4h39c0-10.7-7.7-19-17.3-19h-4.4c-9.6 0-17.3 8.3-17.3 19Z" opacity=".6" />
  </g>
  <!-- 果肉里的籽 -->
  <g fill="currentColor" opacity=".4">
    <ellipse cx="22" cy="41" rx="2.1" ry="3" />
    <ellipse cx="33" cy="44" rx="2.1" ry="3" />
    <ellipse cx="44" cy="40.5" rx="2.1" ry="3" />
  </g>
  <!-- 刀光（把两半分开的那一道） -->
  <path d="M3.5 31.4 60.5 26.6" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" />
</svg>
